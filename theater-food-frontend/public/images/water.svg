<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AED6F1" />
      <stop offset="50%" stop-color="#EBF5FB" />
      <stop offset="100%" stop-color="#85C1E9" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2980B9" />
      <stop offset="100%" stop-color="#1B4F72" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="90" fill="#1C1814" />

  <!-- Bottle Cap -->
  <rect x="90" y="32" width="20" height="12" rx="2" fill="url(#capGrad)" />
  <rect x="92" y="44" width="16" height="6" fill="#BDC3C7" />

  <!-- Bottle Neck & Body -->
  <path d="M92 50 L92 65 C76 80 75 95 75 110 L75 168 C75 174 80 178 86 178 L114 178 C120 178 125 174 125 168 L125 110 C125 95 124 80 108 65 L108 50 Z" fill="url(#waterGrad)" opacity="0.85" stroke="#D4E6F1" stroke-width="1.5" />

  <!-- Bottle Label -->
  <rect x="74" y="108" width="52" height="36" fill="#1A365D" rx="2" />
  <rect x="74" y="112" width="52" height="3" fill="#D7A84B" />
  <text x="100" y="126" font-family="'Playfair Display', serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PURE</text>
  <text x="100" y="136" font-family="sans-serif" font-size="5" fill="#AED6F1" text-anchor="middle">NATURAL SPRING</text>

  <!-- Water Reflections -->
  <path d="M82 75 C80 90 80 155 82 170" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7" fill="none" />
  <path d="M87 85 C86 95 86 140 87 155" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.4" fill="none" />
</svg>
